name = "anemone-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Free plan is enough. Create the database once:  npx wrangler d1 create anemone
# then paste the printed database_id below and apply the schema:
#   npx wrangler d1 execute anemone --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "anemone"
database_id = "8fb136e8-0570-45b9-8a33-e67a53aa511b"

[vars]
# Comma-separated list of site origins allowed to call the API (no trailing slash)
ALLOWED_ORIGINS = "https://alplix.github.io"

# Secrets (never commit):
#   npx wrangler secret put ADMIN_TOKEN     (>= 16 random characters, for the moderation review endpoints)
#   npx wrangler secret put THROTTLE_SALT   (any random string)
